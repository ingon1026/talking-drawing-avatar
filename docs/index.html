<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말하는 그림 아바타 — 데모</title>
<meta name="description" content="텍스트를 입력하면 내 그림이 목소리와 표정으로 말합니다. 설치 없이 브라우저에서 바로.">
<!-- 공유 카드 (카톡·슬랙·트위터 링크 미리보기) — 크롤러는 절대 URL 필요 -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://ingon1026.github.io/talking-drawing-avatar/">
<meta property="og:title" content="말하는 그림 아바타">
<meta property="og:description" content="텍스트를 입력하면 내 그림이 목소리와 표정으로 말합니다. 설치 없이 브라우저에서 바로.">
<meta property="og:image" content="https://ingon1026.github.io/talking-drawing-avatar/assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="말하는 그림 아바타">
<meta name="twitter:description" content="텍스트를 입력하면 내 그림이 목소리와 표정으로 말합니다.">
<meta name="twitter:image" content="https://ingon1026.github.io/talking-drawing-avatar/assets/og-card.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #16161d; color: #e8e8ef;
  }
  main { width: min(560px, 94vw); padding: 24px 0 48px; }
  h1 { font-size: 1.2rem; font-weight: 600; margin: 16px 0; display: flex; justify-content: space-between; align-items: center; }
  h1 a { color: #9a9ab0; font-size: .85rem; text-decoration: none; }
  .stage { width: 100%; aspect-ratio: 1; background: #fff; border-radius: 16px; overflow: hidden; border: 1px solid #2a2a35; position: relative; }
  .warp-shake { position: absolute; inset: 0; will-change: transform; }
  .warp-shake canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { z-index: 0; }
  #cv { z-index: 1; }
  form { display: flex; gap: 8px; margin-top: 16px; }
  input[type=text] { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2a35; background: #0d0d12; color: inherit; font-size: 1rem; }
  button { padding: 10px 16px; border-radius: 10px; border: 0; background: #5b8cff; color: #fff; font-size: .95rem; cursor: pointer; }
  button:disabled { background: #333; cursor: default; }
  button.alt { background: #2a2a35; }
  #mirrorBtn.on { background: #5b8cff; }
  .row { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .controls { margin-top: 16px; display: grid; gap: 10px; font-size: .88rem; }
  .controls label { display: flex; align-items: center; gap: 10px; }
  .controls label span.k { width: 88px; color: #9a9ab0; }
  .controls input[type=range] { flex: 1; }
  select { padding: 8px; border-radius: 8px; background: #0d0d12; color: inherit; border: 1px solid #2a2a35; }
  #status { margin-top: 12px; color: #9a9ab0; font-size: .9rem; min-height: 1.2em; }
  #status.error { color: #ff7a7a; }
  footer { margin-top: 20px; font-size: .8rem; color: #66667a; line-height: 1.5; }
  footer a { color: #8a8aff; }
</style>
</head>
<body>
<main>
  <h1>🎨 말하는 그림 아바타</h1>

  <div class="stage"><div class="warp-shake" id="shake">
    <canvas id="gl" width="512" height="512"></canvas>
    <canvas id="cv" width="512" height="512"></canvas>
  </div></div>

  <form id="form">
    <input id="text" type="text" placeholder="캐릭터가 말할 문장을 입력하세요…" autocomplete="off" value="안녕하세요! 저는 그림 속에서 태어난 아바타예요.">
    <button id="send" type="submit">말하기</button>
  </form>

  <div class="row" id="emotions">
    <span style="color:#9a9ab0;font-size:.88rem">감정:</span>
    <button type="button" class="alt" data-emo="neutral">😐 기본</button>
    <button type="button" class="alt" data-emo="joy">😊 기쁨</button>
    <button type="button" class="alt" data-emo="sad">😢 슬픔</button>
    <button type="button" class="alt" data-emo="angry">😠 화남</button>
    <button type="button" class="alt" data-emo="surprise">😲 놀람</button>
    <button type="button" class="alt" data-emo="fear">😱 무서움</button>
    <button type="button" class="alt" data-emo="shy">😳 수줍음</button>
    <label><input type="checkbox" id="autoEmo" checked> 감정 자동</label>
  </div>

  <div class="row">
    <button type="button" class="alt" id="blinkBtn">👁 지금 깜빡!</button>
    <label><input type="checkbox" id="autoBlink" checked> 자동 깜빡임</label>
    <label><input type="checkbox" id="warpToggle" checked> 얼굴 워핑</label>
    <button type="button" class="alt" id="mirrorBtn" title="웹캠 표정을 캐릭터가 따라합니다">🪞 미러링</button>
    <select id="voice"></select>
    <select id="character"></select>
    <button type="button" class="alt" id="addChar">➕ 그림 추가</button>
    <button type="button" class="alt" id="delChar" style="display:none">🗑 삭제</button>
    <input type="file" id="charFile" accept="image/*" style="display:none">
    <button type="button" class="alt" id="recBtn">🎬 움짤 저장</button>
  </div>

  <div class="controls">
    <label><span class="k">깜빡임 간격</span><input id="blinkInterval" type="range" min="1" max="10" step="0.5" value="4"><span id="blinkIntervalVal">4초</span></label>
    <label><span class="k">눈 감기</span><input id="ovBlink" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label><span class="k">입 벌림</span><input id="ovJaw" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label><span class="k">미소</span><input id="ovSmile" type="range" min="0" max="1" step="0.01" value="0"></label>
  </div>

  <div id="status"></div>

  <footer>
    무료 정적 데모: 브라우저 내장 TTS + 한글 음절→입모양 매핑(근사치)으로 동작합니다.
    로컬 풀버전은 NeuroSync / NVIDIA Audio2Face-3D로 52채널 얼굴 근육을 구동합니다 —
    <a href="https://github.com/ingon1026/talking-drawing-avatar">GitHub 저장소</a>.
    그림을 화면에 끌어다 놓으면 내 캐릭터를 만들 수 있어요 (왼눈→오른눈→입 중심 클릭 → 입 드래그).
  </footer>
</main>

<script src="avatar_core.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const glCanvas = $("gl"), shakeEl = $("shake"), warpToggle = $("warpToggle");
const setStatus = AvatarCore.bindStatus($("status"));

// ---------- 캐릭터 로드 (정적 + 세션 내 사용자 생성) ----------
const PART_FILES = ["base", "brow_L", "brow_R", "eye_L_open", "eye_R_open",
  "eye_L_closed", "eye_R_closed", "pupil_L", "pupil_R",
  "mouth_closed", "mouth_M", "mouth_A", "mouth_E", "mouth_I", "mouth_O", "mouth_U"];
let parts = {}, manifest = { pupilRange: 0, browRange: 0, jawDrop: 8, proceduralMouth: true, mouthStyle: {} };
const userChars = {};  // id → {manifest, parts} (세션 한정)

async function loadCharacter(id) {
  if (userChars[id]) { manifest = userChars[id].manifest; parts = userChars[id].parts; warp.setCharacter(); return; }
  const dir = `characters/${id}`;
  manifest = await fetch(`${dir}/manifest.json`).then(r => r.json());
  const loaded = {};
  await Promise.all(PART_FILES.map(name => new Promise(res => {
    const img = new Image();
    img.onload = () => { loaded[name] = img; res(); };
    img.onerror = () => res();
    img.src = `${dir}/${name}.png`;
  })));
  parts = loaded;
  warp.setCharacter();  // 워프 준비됐으면 새 base 텍스처·커널 중심 반영 (준비 전이면 no-op, init이 이어받음)
}

async function initCharacters(selectId) {
  const list = await fetch("characters/index.json?v=" + Date.now()).then(r => r.json());  // Pages 10분 캐시 우회
  const sel = $("character");
  sel.innerHTML = list.map(c => `<option value="${c.id}">${c.name}</option>`).join("")
    + Object.entries(userChars).map(([id, c]) => `<option value="${id}">${c.manifest.name}</option>`).join("");
  sel.onchange = () => { loadCharacter(sel.value); updateDelBtn(); };
  // 기본 캐릭터가 메인 — 목록 순서·캐시와 무관하게 default 우선
  const def = list.find(c => c.id === "default");
  const pick = selectId || (def ? def.id : (list.length && list[0].id));
  if (pick) { sel.value = pick; await loadCharacter(pick); }
  updateDelBtn();
}

function updateDelBtn() {
  // 세션 내 사용자 생성 캐릭터만 삭제 대상 (userChars 존재 여부가 곧 플래그)
  $("delChar").style.display = userChars[$("character").value] ? "" : "none";
}
$("delChar").onclick = async () => {
  const id = $("character").value;
  if (!userChars[id] || !confirm("이 캐릭터를 삭제할까요?")) return;
  delete userChars[id];
  await initCharacters();
  setStatus("삭제했습니다.");
};

// ---------- 브라우저 TTS ----------
function loadVoices() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang.startsWith("ko"));
  $("voice").innerHTML = vs.length
    ? vs.map((v, i) => `<option value="${i}">${v.name}</option>`).join("")
    : `<option value="-1">한국어 음성 없음 (기본 음성 사용)</option>`;
  return vs;
}
let koVoices = loadVoices();
speechSynthesis.onvoiceschanged = () => { koVoices = loadVoices(); };

// ---------- 한글 음절 → 입모양 타임라인 ----------
const VOWEL_SHAPES = {  // 중성 인덱스 → 목표 가중치
  A:  { jawopen: 0.55 },                                  // ㅏㅑ 등
  EO: { jawopen: 0.32 },                                  // ㅓㅕㅡ
  O:  { jawopen: 0.3, mouthpucker: 0.8 },                 // ㅗㅛㅜㅠ — 오늘 둥근 O 렌더가 확실히 발동하게 강화
  I:  { jawopen: 0.22, mouthsmileleft: 0.4, mouthsmileright: 0.4 },  // ㅣㅐㅔ...
};
// 중성 순서: ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ
const V_MAP = ["A","I","A","I","EO","I","EO","I","O","A","A","O","O","O","O","O","O","O","EO","EO","I"];
const LABIAL_INIT = new Set([6, 7, 8, 17]);   // ㅁㅂㅃㅍ
const LABIAL_FINAL = new Set([16, 17, 26]); // 종성 ㅁㅂㅍ

function buildTimeline(text, rate = 1) {
  const segs = [];
  let t = 0;
  const SYL = 0.185 / rate;  // 초/음절 (감정에 따라 말이 빨라지면 입도 같이 빨라짐, boundary 로 보정)
  for (let i = 0; i < text.length; i++) {
    const code = text.charCodeAt(i);
    if (code >= 0xAC00 && code <= 0xD7A3) {
      const s = code - 0xAC00;
      const init = Math.floor(s / 588), vowel = Math.floor(s / 28) % 21, fin = s % 28;
      let t0 = t;
      if (LABIAL_INIT.has(init)) { segs.push({ t0, t1: t0 + 0.05, w: { mouthclose: 0.6 }, ci: i }); t0 += 0.05; }
      segs.push({ t0, t1: t + SYL - (LABIAL_FINAL.has(fin) ? 0.05 : 0), w: VOWEL_SHAPES[V_MAP[vowel]], ci: i });
      if (LABIAL_FINAL.has(fin)) segs.push({ t0: t + SYL - 0.05, t1: t + SYL, w: { mouthclose: 0.6 }, ci: i });
      t += SYL;
    } else if (/[.,!?…]/.test(text[i])) { segs.push({ t0: t, t1: t + 0.28, w: {}, ci: i }); t += 0.28; }
    else if (text[i] === " ") { segs.push({ t0: t, t1: t + 0.09, w: {}, ci: i }); t += 0.09; }
  }
  return segs;
}

let talk = null;  // {segs, start, offset}
function speak(text, prosody, done) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const vi = +$("voice").value;
  if (koVoices[vi]) u.voice = koVoices[vi];
  u.lang = "ko-KR";
  // 감정 → 목소리 톤 (브라우저 TTS는 배수 단위: rate 0.1~10, pitch 0~2)
  const rate = Math.max(0.5, Math.min(2, 1 + (prosody ? prosody.rate : 0)));
  u.rate = rate;
  u.pitch = Math.max(0, Math.min(2, 1 + (prosody ? prosody.pitch : 0)));
  const segs = buildTimeline(text, rate);
  u.onstart = () => { talk = { segs, start: performance.now(), offset: 0 }; };
  u.onboundary = e => {  // 실제 발화 위치로 타임라인 재동기화
    if (!talk) return;
    const seg = talk.segs.find(s => s.ci >= e.charIndex);
    if (seg) talk.offset = seg.t0 - (performance.now() - talk.start) / 1000;
  };
  u.onend = u.onerror = () => { talk = null; done && done(); };
  speechSynthesis.speak(u);
}

function currentWeights() {
  if (!talk) return {};
  const t = (performance.now() - talk.start) / 1000 + talk.offset;
  const seg = talk.segs.find(s => t >= s.t0 && t < s.t1);
  return seg ? seg.w : {};
}

// ---------- 상태 ----------
let smooth = {};
const W = k => smooth[k] || 0;

const stage = document.querySelector(".stage");

// ---------- 공유 렌더 코어 인스턴스 (avatar_core.js) ----------
const emo = AvatarCore.makeEmotion(document.querySelectorAll("#emotions button"), "#5b8cff");
const blinker = AvatarCore.makeBlink({
  autoBlink: () => $("autoBlink").checked,
  intervalMs: () => +$("blinkInterval").value * 1000,
  duration: 140, jitter: 0.6,
});
const cursor = AvatarCore.makeCursorTracker(stage);
const gaze = AvatarCore.makeGaze(cursor, { mulX: 0.9, mulY: 0.6 });   // 커서 + 감정 채널 + 유휴 saccade
const headWander = AvatarCore.makeHeadWander();
const mouthPicker = AvatarCore.makeMouthPicker(W);
const warp = AvatarCore.makeWarp({
  threeUrl: "./vendor/three.module.js", glCanvas,   // Pages 서브패스 대응: 문서 기준 상대경로
  getParts: () => parts, getManifest: () => manifest, W,
});
const annotator = AvatarCore.makeAnnotator({
  cv, ctx, setStatus, needDataUrl: false,
  onCreate: async (annot, name, done) => {   // 클라이언트에서 canvas 로 캐릭터 빌드 (서버 없음)
    const id = buildClientCharacter(annot, name || "내 캐릭터");
    done();
    await initCharacters(id);
    setStatus("✅ 캐릭터가 추가됐어요 (새로고침 전까지 유지). 문장을 입력해보세요!");
  },
});

// 드래그앤드랍·파일 입력 (어노테이터로 위임)
stage.addEventListener("dragover", e => e.preventDefault());
stage.addEventListener("drop", e => { e.preventDefault(); annotator.acceptFile(e.dataTransfer.files[0]); });
$("addChar").onclick = () => $("charFile").click();
$("charFile").onchange = e => { annotator.acceptFile(e.target.files[0]); e.target.value = ""; };

// ---------- 웹캠 미러링 (코어 makeMirror — MediaPipe 블렌드셰이프 → 스프라이트 채널) ----------
const mirror = AvatarCore.makeMirror({
  onStatus: setStatus,
});
$("mirrorBtn").onclick = () => {
  if (mirror.on) { mirror.stop(); $("mirrorBtn").classList.remove("on"); return; }
  mirror.start().then(() => $("mirrorBtn").classList.add("on"))
    .catch(e => { mirror.stop(); $("mirrorBtn").classList.remove("on"); setStatus("미러링 실패: " + e.message, true); });
};

// 깜빡임 UI 배선
$("blinkBtn").onclick = () => blinker.trigger();
$("blinkInterval").oninput = e => $("blinkIntervalVal").textContent = e.target.value + "초";

// ---------- 렌더 루프 ----------
function render(now) {
  requestAnimationFrame(render);
  if (annotator.active()) {
    shakeEl.style.transform = "none";       // 어노테이션 중엔 흔들림 없음 (getBoundingClientRect 정합 유지)
    glCanvas.style.visibility = "hidden";   // 워프 캔버스 숨김
    annotator.draw();
    return;
  }
  if (!parts.base) return;

  AvatarCore.smoothStep(smooth, currentWeights());
  mirror.apply(smooth, now);   // 미러링 중이면 웹캠 표정 채널을 max-결합
  smooth.jawopen = Math.max(smooth.jawopen || 0, +$("ovJaw").value);
  const smileOv = +$("ovSmile").value;
  smooth.mouthsmileleft = Math.max(smooth.mouthsmileleft || 0, smileOv);
  smooth.mouthsmileright = Math.max(smooth.mouthsmileright || 0, smileOv);
  emo.applyMax(smooth, !!talk);   // 발화 중이면 감정 유지, 유휴면 자동 감정 감쇠
  const blink = Math.max(blinker.value(now), +$("ovBlink").value, W("eyeblinkleft"), W("eyeblinkright"));

  // 머리: 발화 에너지 끄덕임 + 느린 표류 + 잔잔한 사인
  const sway = talk ? 1 : 0.5;
  headWander(shakeEl, now, W("jawopen"), sway, emo.current());   // 감정 → 몸짓 연동

  const warpOn = warp.ready && warpToggle.checked;
  if (warpOn) { glCanvas.style.visibility = "visible"; warp.render(); }
  else { glCanvas.style.visibility = "hidden"; }

  ctx.clearRect(0, 0, 512, 512);
  const draw = (n, dyy = 0) => parts[n] && ctx.drawImage(parts[n], 0, dyy);
  const drawXY = (n, dx, dyy) => parts[n] && ctx.drawImage(parts[n], dx, dyy);
  if (!warpOn) {   // 워프 OFF/미지원: 2D가 흰 배경+base를 그림 (폴백). ON이면 WebGL이 base 담당, 배경은 .stage 흰색.
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 512, 512);
    draw("base");
  }
  const browUp = -(manifest.browRange || 0) * Math.min(1, W("browinnerup") + (W("browouterupleft") + W("browouterupright")) / 2)
               + (manifest.browRange || 0) * 0.8 * (W("browdownleft") + W("browdownright")) / 2;
  draw("brow_L", browUp); draw("brow_R", browUp);
  if (blink > 0.5) { draw("eye_L_closed"); draw("eye_R_closed"); }
  else {
    draw("eye_L_open"); draw("eye_R_open");
    const [gzx, gzy] = gaze(0, W);   // 슬라이더 없음 → 커서/감정채널/유휴 saccade
    const pr = manifest.pupilRange || 0;
    drawXY("pupil_L", gzx * pr, gzy * pr); drawXY("pupil_R", gzx * pr, gzy * pr);
  }
  const jawDy = warp.jawOverlayDy(W("jawopen"), warpOn, manifest);
  if (manifest.proceduralMouth === false && parts.mouth_closed) {
    AvatarCore.drawSpriteMouth(ctx, parts, mouthPicker, now, jawDy);  // 스프라이트 크로스페이드
  } else {
    AvatarCore.drawVectorMouth(ctx, W, manifest, jawDy);
  }
  // 움짤 녹화 중이면 두 캔버스(WebGL base + 2D 오버레이)를 합성 캔버스에 합침.
  // 이 시점(warp.render 직후 같은 프레임)이라 WebGL drawingBuffer 가 아직 살아있어 drawImage 가능.
  if (rec) {
    capCtx.fillStyle = "#fff"; capCtx.fillRect(0, 0, 512, 512);
    if (warpOn) capCtx.drawImage(glCanvas, 0, 0);
    capCtx.drawImage(cv, 0, 0);
  }
}
requestAnimationFrame(render);

// ---------- 움짤 녹화 (두 캔버스 합성 → WebM 다운로드, 서버 불필요) ----------
const cap = document.createElement("canvas"); cap.width = cap.height = 512;
const capCtx = cap.getContext("2d");
let rec = null, chunks = [];
const REC_MIME = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"]
  .find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
$("recBtn").onclick = () => {
  if (!window.MediaRecorder || !REC_MIME) { setStatus("이 브라우저는 녹화를 지원하지 않아요.", true); return; }
  if (rec) {                                   // 정지 → 다운로드
    rec.stop(); return;
  }
  chunks = [];
  rec = new MediaRecorder(cap.captureStream(30), { mimeType: REC_MIME });
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const url = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
    const a = document.createElement("a");
    a.href = url; a.download = `talking-avatar-${Date.now()}.webm`; a.click();
    URL.revokeObjectURL(url);
    rec = null; $("recBtn").textContent = "🎬 움짤 저장"; $("recBtn").style.background = "";
    setStatus("움짤을 저장했어요! 🎉");
  };
  rec.start();
  $("recBtn").textContent = "⏹ 녹화 중지"; $("recBtn").style.background = "#c0392b";
  setStatus("● 녹화 중… 문장을 입력하거나 감정 버튼을 눌러보세요");
};

$("form").onsubmit = e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  // 감정 자동: 얼굴 프리셋 + 목소리 톤(속도·음높이)을 함께 적용
  let prosody = null;
  if ($("autoEmo").checked) {
    const r = AvatarCore.inferEmotion(text);
    if (r) { emo.setEmotion(r.emo, r.intensity, false); prosody = AvatarCore.voiceProsody(r.emo, r.intensity); }   // 자동 감정 — 발화 후 중립 복귀
  }
  speak(text, prosody);
  setStatus("");
};

// ---------- 자동 쇼케이스: 유휴 시 아바타가 먼저 인사·감정 시연 (첫 방문자 유도) ----------
const showcase = AvatarCore.makeShowcase(step => new Promise(resolve => {
  emo.setEmotion(step.emo, 0.9, false);
  setStatus("💬 " + step.text);
  let fin = false;
  const done = () => { if (!fin) { fin = true; resolve(); } };
  speak(step.text, AvatarCore.voiceProsody(step.emo, 0.9), done);
  setTimeout(done, 1200 + step.text.length * 130);   // 백업: 소리 막힘/onend 유실에도 진행
}));
let idleTimer = null;
function scheduleShowcase() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!showcase.running && !mirror.on) showcase.play().then(() => setStatus("")); }, 7000);   // 미러링 중엔 쇼케이스 없음
}
function onUserActive() {         // 상호작용하면 쇼케이스 즉시 중단 + 유휴 타이머 리셋
  if (showcase.running) { showcase.stop(); speechSynthesis.cancel(); setStatus(""); }
  scheduleShowcase();
}
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, onUserActive));
scheduleShowcase();

// ---------- 캐릭터 클릭 반응: 아바타를 누르면 감정 섞인 한마디 (클릭=제스처라 소리 남) ----------
stage.style.cursor = "pointer";
stage.addEventListener("click", () => {
  if (annotator.active()) return;   // 4클릭 어노테이션 중엔 좌표 클릭이라 제외
  showcase.stop();
  const r = AvatarCore.pickReaction();
  emo.setEmotion(r.emo, 0.95, false);
  setStatus("💬 " + r.text);
  speak(r.text, AvatarCore.voiceProsody(r.emo, 0.95));
});

// ---------- 드래그앤드랍 캐릭터 생성 (클라이언트 빌더) ----------
function ringMedian(c2d, box) {  // box 주변 4px 링의 중앙값 색
  const [x0, y0, x1, y1] = box.map(Math.round), R = 4, vals = [[], [], []];
  const grab = (x, y) => {
    if (x < 0 || y < 0 || x >= 512 || y >= 512) return;
    const d = c2d.getImageData(x, y, 1, 1).data;
    vals[0].push(d[0]); vals[1].push(d[1]); vals[2].push(d[2]);
  };
  for (let x = x0 - R; x <= x1 + R; x += 2) { for (let y = y0 - R; y < y0; y += 2) grab(x, y); for (let y = y1; y <= y1 + R; y += 2) grab(x, y); }
  for (let y = y0; y <= y1; y += 2) { for (let x = x0 - R; x < x0; x += 2) grab(x, y); for (let x = x1; x <= x1 + R; x += 2) grab(x, y); }
  const med = a => a.sort((p, q) => p - q)[a.length >> 1] || 255;
  return `rgb(${med(vals[0])},${med(vals[1])},${med(vals[2])})`;
}

function buildClientCharacter(annot, name) {
  const { img, s, ox, oy, eyeL, eyeR, mouthC, box } = annot;
  const T = (x, y) => [ox + x * s, oy + y * s];
  const mk = () => { const c = document.createElement("canvas"); c.width = c.height = 512; return c; };

  const baseC = mk(), b = baseC.getContext("2d");
  b.fillStyle = "#fff"; b.fillRect(0, 0, 512, 512);
  b.drawImage(img, ox, oy, img.width * s, img.height * s);

  const eyeR_px = Math.max(6, 0.03 * Math.max(img.width, img.height));
  const newParts = {};
  for (const [side, p] of [["L", eyeL], ["R", eyeR]]) {
    const [cx, cy] = T(p[0], p[1]), r = eyeR_px * s;
    const boxE = [cx - r, cy - r, cx + r, cy + r];
    const open = mk();
    open.getContext("2d").drawImage(baseC, boxE[0], boxE[1], 2 * r, 2 * r, boxE[0], boxE[1], 2 * r, 2 * r);
    newParts[`eye_${side}_open`] = open;
    const closed = mk(), cc = closed.getContext("2d");
    cc.strokeStyle = "#1a1a1a"; cc.lineWidth = Math.max(3, r * 0.35);
    cc.beginPath(); cc.arc(cx, cy - r * 0.1, r * 0.8, 0.2 * Math.PI, 0.8 * Math.PI); cc.stroke();
    newParts[`eye_${side}_closed`] = closed;
    b.fillStyle = ringMedian(b, boxE); b.fillRect(boxE[0] - 1, boxE[1] - 1, 2 * r + 2, 2 * r + 2);
  }
  const mBox = [...T(box[0], box[1]), ...T(box[2], box[3])];
  b.fillStyle = ringMedian(b, mBox);
  b.fillRect(mBox[0] - 1, mBox[1] - 1, mBox[2] - mBox[0] + 2, mBox[3] - mBox[1] + 2);
  newParts.base = baseC;

  const [mcx, mcy] = T(mouthC[0], mouthC[1]);
  const id = "u_" + Math.random().toString(36).slice(2, 8);
  userChars[id] = {
    manifest: { name, mouthCenter: [mcx, mcy], jawDrop: 6, proceduralMouth: true,
                mouthStyle: { line: "#2b2b2b", fill: "#8a3535", teeth: "#fff", tongue: "#d97b7b",
                              width: Math.max(12, (mBox[2] - mBox[0]) * 0.42) } },
    parts: newParts,
  };
  return id;
}

warp.init();   // WebGL 워프 초기화 (실패 시 조용히 폴백). loadCharacter와 경쟁은 양방향 처리됨.
initCharacters();
</script>
