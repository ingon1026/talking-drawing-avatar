<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>석고상 미러링 — NVIDIA mark</title>
<!-- studio3d.html 에서 발화·대화·감정 UI 를 뺀 미러링 전용 페이지. 같은 렌더 코어
     (avatar_core.js makeMirror)로 mark 헤드 모프타깃을 웹캠 표정으로 구동한다.
     mark.glb 는 Maya-ACE(MIT) 파생 — 라이선스 확인 후 drawface-live 에서 공개 배포 중.
     여기 gitignore 는 용량(41MB)·재생성 가능 산출물이라는 이유로 유지. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #16161d; color: #e8e8ef;
  }
  main { width: min(560px, 94vw); padding: 24px 0 48px; }
  h1 { font-size: 1.2rem; font-weight: 600; margin: 16px 0; display: flex; justify-content: space-between; align-items: center; }
  h1 a { color: #9a9ab0; font-size: .85rem; text-decoration: none; }
  .stage { width: 100%; aspect-ratio: 1; background: #0d0d12; border-radius: 16px; overflow: hidden; border: 1px solid #2a2a35; cursor: grab; }
  canvas { width: 100%; height: 100%; display: block; }
  .row { display: flex; gap: 8px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
  button { padding: 10px 16px; border-radius: 10px; border: 0; background: #76b900; color: #fff; font-size: .95rem; cursor: pointer; }
  button.alt { background: #2a2a35; }
  #status { margin-top: 12px; color: #9a9ab0; font-size: .9rem; min-height: 1.2em; }
  #status.error { color: #ff7a7a; }
</style>
<script type="importmap">{ "imports": { "three": "/static/vendor/three.module.js" } }</script>
</head>
<body>
<main>
  <h1>🗿 석고상 미러링 <a href="/3d">← NVIDIA 3D 스튜디오</a></h1>

  <div class="stage"><canvas id="cv"></canvas></div>

  <div class="row">
    <button id="mirrorBtn">🪞 미러링 시작</button>
    <button type="button" class="alt" id="blinkBtn">👁 지금 깜빡!</button>
    <select id="headSel" style="padding:10px;border-radius:10px;background:#0d0d12;color:inherit;border:1px solid #2a2a35">
      <option value="mark">🗿 석고상 남 (mark)</option>
      <option value="claire">🗿 석고상 여 (claire)</option>
      <option value="rpm">🧑 Ready Player Me (로컬 테스트)</option>
    </select>
    <label style="display:flex;align-items:center;gap:6px;font-size:.9rem;color:#9a9ab0;cursor:pointer">
      <input type="checkbox" id="headMove"> 머리 움직임
    </label>
  </div>

  <div id="status">3D 모델 로딩 중…</div>
  <div id="headDbg" style="margin-top:6px;color:#76b900;font:13px monospace;min-height:1.2em"></div>

  <div id="panel" style="display:none;margin-top:14px"></div>
</main>

<script src="/static/avatar_core.js"></script>
<script type="module">
let THREE, GLTFLoader, MeshoptDecoder;
try {
  THREE = await import("three");
  ({ GLTFLoader } = await import("/static/vendor/GLTFLoader.js"));
  // claire.glb 는 meshopt 압축본 — 디코더 필요 (mark 는 무압축이라 없어도 로드됨)
  ({ MeshoptDecoder } = await import("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/meshopt_decoder.module.js"));
} catch (e) {
  document.getElementById("status").textContent = "3D 모듈 로드 실패: " + e.message;
  throw e;
}

const $ = id => document.getElementById(id);
const setStatus = AvatarCore.bindStatus($("status"));

// ---------- Three.js 씬 (studio3d 와 동일) ----------
const canvas = $("cv");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d12);
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 1000);
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x2a2018, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1.5, 2, 3); scene.add(key);
const rim = new THREE.DirectionalLight(0x77aaff, 1.0); rim.position.set(-2, 1, -2); scene.add(rim);

const group = new THREE.Group();
scene.add(group);
let morphMeshes = [], eyes = [];
let smooth = {};
const W = k => smooth[k] || 0;

// 눈알 구체 — 안구 메시가 없는 석고 헤드(mark·claire)용. bbox 분율로 헤드 크기에 맞춤.
function makeEye(sign, box) {
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const k = s.y / 41.5;
  const eg = new THREE.Group();
  eg.position.set(c.x + sign * 0.111 * s.x, c.y + 0.151 * s.y, c.z + 0.284 * s.z);
  const mat = (color, roughness) => new THREE.MeshStandardMaterial({ color, roughness });
  const sclera = new THREE.Mesh(new THREE.SphereGeometry(1.15 * k, 32, 16), mat(0xf2f0ee, 0.35));
  const iris = new THREE.Mesh(new THREE.SphereGeometry(0.46 * k, 24, 12), mat(0x44546e, 0.3));
  iris.position.z = 0.78 * k;
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.2 * k, 16, 8), mat(0x0c0c0c, 0.4));
  pupil.position.z = 1.0 * k;
  eg.add(sclera, iris, pupil);
  group.add(eg);
  return eg;
}

// 헤드별 특성: 석고(mark·claire)는 머리만 있고 안구 메시가 없어 구체를 넣는다.
// RPM 아바타는 반신(머리~가슴)이고 눈·머리카락·옷이 이미 있으며 eyeLook 모프로 눈이 돌아간다.
const HEADS = {
  mark:   { url: "/static/assets3d/mark.glb",   eyeSpheres: true,  headFrac: 1.0  },
  claire: { url: "/static/assets3d/claire.glb", eyeSpheres: true,  headFrac: 1.0  },
  rpm:    { url: "/static/assets3d/rpm.glb",    eyeSpheres: false, headFrac: 0.22 },
};
const cache = {};
let sceneNode = null;
function loadHead(name) {
  const cfg = HEADS[name];
  const done = g => {
    if (sceneNode) group.remove(sceneNode);
    eyes.forEach(e => group.remove(e)); eyes = [];
    group.position.set(0, 0, 0);
    group.updateMatrixWorld(true);          // .position 을 matrixWorld 에 반영 후 bbox 계산
    sceneNode = g.scene;
    // 모프 가진 메시를 전부 모은다 — RPM 은 머리·눈·이빨이 각각 모프를 갖고 있어
    // 하나만 구동하면 눈·이빨이 따로 논다 (석고는 단일 메시라 결과적으로 1개).
    morphMeshes = [];
    sceneNode.traverse(o => {
      if (!o.isMesh || !o.morphTargetInfluences) return;
      o.frustumCulled = false;
      morphMeshes.push({ inf: o.morphTargetInfluences,
        map: Object.entries(o.morphTargetDictionary || {}).map(([n, i]) => [AvatarCore.norm(n), i]) });
    });
    if (!morphMeshes.length) { setStatus(name + ": 모프타깃 메시를 못 찾음", true); return; }
    group.add(sceneNode);
    const box = new THREE.Box3().setFromObject(sceneNode);
    const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
    if (cfg.eyeSpheres) eyes = [makeEye(1, box), makeEye(-1, box)];
    // 프레이밍: 석고는 전체가 머리 / RPM 은 반신이라 상단 headFrac 만큼을 머리로 보고 맞춘다
    const headH = s.y * cfg.headFrac;
    const focusY = cfg.headFrac === 1 ? c.y : box.max.y - headH * 0.42;
    group.position.set(-c.x, -focusY, -c.z);
    camera.position.set(0, 0, headH * 2.0);
    camera.lookAt(0, 0, 0);
    camera.near = headH / 100; camera.far = headH * 100; camera.updateProjectionMatrix();
    setStatus("🪞 미러링 시작을 누르고 카메라를 허용해주세요");
  };
  setStatus(name + " 로딩 중…");
  if (cache[name]) return done(cache[name]);
  const loader = new GLTFLoader();
  if (MeshoptDecoder) loader.setMeshoptDecoder(MeshoptDecoder);
  loader.load(cfg.url, g => { cache[name] = g; done(g); },
    undefined, e => setStatus(name + " 로드 실패: " + e, true));
}
$("headSel").onchange = () => loadHead($("headSel").value);
loadHead("mark");

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = 1; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);

// 드래그로 헤드 회전
let dragging = false, px = 0, py = 0, userYaw = 0, userPitch = 0;
canvas.addEventListener("pointerdown", e => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener("pointerup", () => dragging = false);
addEventListener("pointermove", e => {
  if (!dragging) return;
  userYaw += (e.clientX - px) * 0.005; userPitch += (e.clientY - py) * 0.003;
  userPitch = Math.max(-0.4, Math.min(0.4, userPitch));
  px = e.clientX; py = e.clientY;
});

// ---------- 렌더 부품 (studio3d 와 동일 코어) ----------
const cursor = AvatarCore.makeCursorTracker(canvas);
const gaze = AvatarCore.makeGaze(cursor, { mulX: 0.8, mulY: 0.5 });
const blinker = AvatarCore.makeBlink({ autoBlink: () => true, intervalMs: () => 3500, duration: 150, jitter: 0.8 });
$("blinkBtn").onclick = () => blinker.trigger();

const mirror = AvatarCore.makeMirror({
  onStatus: setStatus,
});
const mpanel = AvatarCore.makeMirrorPanel(mirror, $("panel"));   // 비교군 분석 패널 (코어 공용)
$("mirrorBtn").onclick = () => {
  if (mirror.on) {
    mirror.stop(); $("mirrorBtn").textContent = "🪞 미러링 시작";
    $("panel").style.display = "none";
    return;
  }
  mirror.start().then(() => { $("mirrorBtn").textContent = "⏹ 미러링 종료"; $("panel").style.display = ""; })
    .catch(e => { mirror.stop(); $("mirrorBtn").textContent = "🪞 미러링 시작"; setStatus("미러링 실패: " + e.message, true); });
};

// ---------- 렌더 루프 (studio3d 에서 발화·감정 뺀 것) ----------
let nod = 0, dbgAt = 0;
function render(now) {
  requestAnimationFrame(render);
  if (!morphMeshes.length) return;

  smooth = {};
  mirror.apply(smooth, now);   // 웹캠 표정 채널
  mpanel.draw(W);   // 비교군 패널
  const blink = Math.max(blinker.value(now), W("eyeblinkleft"), W("eyeblinkright"));

  for (const { inf, map } of morphMeshes) {
    for (const [k, idx] of map) {
      inf[idx] = k === "eyeblinkleft" || k === "eyeblinkright" ? blink : (smooth[k] || 0);
    }
  }

  const [gsx, gsy] = gaze(0, W);   // 미러링 시선 채널 > 커서
  for (const e of eyes) e.rotation.set(gsy * 0.3, gsx * 0.4, 0);

  // 머리 회전: 토글 ON 이면 웹캠 머리 자세를 전이, OFF 면 표정만 (기존 동작)
  nod = 0.85 * nod + 0.15 * W("jawopen");
  const on = $("headMove").checked;
  const h = on ? mirror.head() : null;
  if (h) group.rotation.set(userPitch + h[1] + nod * 0.04, userYaw + h[0], h[2]);
  else group.rotation.set(userPitch + nod * 0.04, userYaw, 0);
  if (on && now - dbgAt > 150) {   // 값이 오는지·부호가 맞는지 눈으로 확인
    dbgAt = now;
    $("headDbg").textContent = h
      ? `머리 yaw ${h[0] >= 0 ? "+" : ""}${h[0].toFixed(2)}  pitch ${h[1] >= 0 ? "+" : ""}${h[1].toFixed(2)}  roll ${h[2] >= 0 ? "+" : ""}${h[2].toFixed(2)}`
      : (mirror.on ? "머리 값 없음 — 얼굴 미검출 또는 캘리브레이션 중" : "미러링을 시작하세요");
  } else if (!on && $("headDbg").textContent) $("headDbg").textContent = "";   // 켜져 있던 흔적만 1회 지움
  renderer.render(scene, camera);
}
requestAnimationFrame(render);
</script>
</body>
</html>
