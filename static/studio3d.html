<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NVIDIA 3D 스튜디오</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #16161d; color: #e8e8ef;
  }
  main { width: min(560px, 94vw); padding: 24px 0 48px; }
  h1 { font-size: 1.2rem; font-weight: 600; margin: 16px 0; display: flex; justify-content: space-between; align-items: center; }
  h1 a { color: #9a9ab0; font-size: .85rem; text-decoration: none; }
  .stage { width: 100%; aspect-ratio: 1; background: #0d0d12; border-radius: 16px; overflow: hidden; border: 1px solid #2a2a35; cursor: grab; }
  canvas { width: 100%; height: 100%; display: block; }
  form { display: flex; gap: 8px; margin-top: 16px; }
  input[type=text] { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2a35; background: #0d0d12; color: inherit; font-size: 1rem; }
  button { padding: 10px 16px; border-radius: 10px; border: 0; background: #76b900; color: #fff; font-size: .95rem; cursor: pointer; }
  button:disabled { background: #333; }
  button.alt { background: #2a2a35; }
  .row { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .controls { margin-top: 16px; display: grid; gap: 10px; font-size: .88rem; }
  .controls label { display: flex; align-items: center; gap: 10px; }
  .controls label span.k { width: 88px; color: #9a9ab0; }
  .controls input[type=range] { flex: 1; }
  select { padding: 8px; border-radius: 8px; background: #0d0d12; color: inherit; border: 1px solid #2a2a35; }
  #status { margin-top: 12px; color: #9a9ab0; font-size: .9rem; min-height: 1.2em; }
  #status.error { color: #ff7a7a; }
  #chatlog {
    margin-top: 14px; display: grid; gap: 8px; max-height: 200px; overflow-y: auto;
    padding: 12px; background: #0d0d12; border: 1px solid #2a2a35; border-radius: 12px;
  }
  #chatlog .turn { font-size: .9rem; line-height: 1.45; }
  #chatlog .who { font-size: .75rem; color: #767888; margin-right: 6px; }
  #chatlog .me { color: #b9d68a; }
  #chatlog .bot { color: #e8e8ef; }
  #micBtn.on { background: #e2647e; }
  #mirrorBtn.on { background: #76b900; }
</style>
<script type="importmap">{ "imports": { "three": "/static/vendor/three.module.js" } }</script>
</head>
<body>
<main>
  <h1>🟩 NVIDIA 3D 스튜디오 <a href="/puppet">← 2D 퍼펫 모드</a></h1>

  <div class="stage"><canvas id="cv"></canvas></div>

  <form id="form">
    <button id="micBtn" type="button" class="alt" title="마이크로 말 걸기" style="display:none">🎤</button>
    <input id="text" type="text" placeholder="mark가 말할 문장을 입력하세요…" autocomplete="off">
    <button id="send" type="submit">말하기</button>
  </form>
  <div class="row" id="chatRow">
    <label><input type="checkbox" id="chatMode"> 💬 대화 모드 <span style="color:#767888;font-size:.82rem">(내 말에 mark가 대답)</span></label>
    <button type="button" class="alt" id="clearChat" style="display:none">대화 지우기</button>
  </div>
  <div id="chatlog" style="display:none"></div>

  <div class="row" id="emotions">
    <span style="color:#9a9ab0;font-size:.88rem">감정:</span>
    <button type="button" class="alt" data-emo="neutral">😐</button>
    <button type="button" class="alt" data-emo="joy">😊</button>
    <button type="button" class="alt" data-emo="sad">😢</button>
    <button type="button" class="alt" data-emo="angry">😠</button>
    <button type="button" class="alt" data-emo="surprise">😲</button>
    <button type="button" class="alt" data-emo="fear">😱</button>
    <button type="button" class="alt" data-emo="shy">😳</button>
    <label><input type="checkbox" id="autoEmo" checked> 감정 자동</label>
  </div>

  <div class="row">
    <button type="button" class="alt" id="blinkBtn">👁 지금 깜빡!</button>
    <button type="button" class="alt" id="mirrorBtn" title="웹캠 표정을 석고상이 따라합니다">🪞 미러링</button>
    <label><input type="checkbox" id="autoBlink" checked> 자동 깜빡임</label>
    <label style="display:flex;align-items:center;gap:6px;font-size:.9rem;color:#9a9ab0;cursor:pointer">
      <input type="checkbox" id="headMove"> 머리 움직임
    </label>
    <select id="voice">
      <option value="ko-KR-InJoonNeural">인준 (남성)</option>
      <option value="ko-KR-HyunsuMultilingualNeural">현수 (남성)</option>
      <option value="ko-KR-SunHiNeural">선히 (여성)</option>
    </select>
    <select id="engine">
      <option value="a2f">NVIDIA A2F-3D</option>
      <option value="neurosync">NeuroSync</option>
    </select>
  </div>

  <div class="controls">
    <label><span class="k">눈 감기</span><input id="ovBlink" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label><span class="k">입 벌림</span><input id="ovJaw" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label><span class="k">미소</span><input id="ovSmile" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label><span class="k">눈썹</span><input id="ovBrow" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label><span class="k">시선 좌우</span><input id="ovGaze" type="range" min="-1" max="1" step="0.01" value="0"></label>
  </div>

  <div id="status">3D 모델 로딩 중… (41MB, 최초 1회)</div>
  <audio id="audio"></audio>

  <div id="panel" style="display:none;margin-top:14px"></div>
</main>

<script src="/static/avatar_core.js"></script>
<script type="module">
let THREE, GLTFLoader;
try {
  THREE = await import("three");
  ({ GLTFLoader } = await import("/static/vendor/GLTFLoader.js"));
} catch (e) {
  document.getElementById("status").textContent = "3D 모듈 로드 실패: " + e.message;
  throw e;
}

const $ = id => document.getElementById(id);
const audio = $("audio");
const setStatus = AvatarCore.bindStatus($("status"));

// ---------- Three.js 씬 ----------
const canvas = $("cv");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d12);
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 1000);
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x2a2018, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1.5, 2, 3); scene.add(key);
const rim = new THREE.DirectionalLight(0x77aaff, 1.0); rim.position.set(-2, 1, -2); scene.add(rim);

const group = new THREE.Group();
scene.add(group);
let mesh = null, dict = {}, eyes = [], morphMap = [];

function makeEye(cx) {
  const eg = new THREE.Group();
  eg.position.set(cx, 159.75, 3.35);  // eyeBlink 델타 중심에서 계산한 소켓 좌표
  const mat = (color, roughness) => new THREE.MeshStandardMaterial({ color, roughness });
  const sclera = new THREE.Mesh(new THREE.SphereGeometry(1.15, 32, 16), mat(0xf2f0ee, 0.35));
  const iris = new THREE.Mesh(new THREE.SphereGeometry(0.46, 24, 12), mat(0x44546e, 0.3));
  iris.position.z = 0.78;
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 8), mat(0x0c0c0c, 0.4));
  pupil.position.z = 1.0;
  eg.add(sclera, iris, pupil);
  group.add(eg);
  return eg;
}

new GLTFLoader().load("/static/assets3d/mark.glb", g => {
  g.scene.traverse(o => { if (o.isMesh) mesh = o; });
  dict = mesh.morphTargetDictionary || {};
  morphMap = Object.entries(dict).map(([name, idx]) => [AvatarCore.norm(name), idx]);  // 매 프레임 regex 방지
  group.add(g.scene);
  const box = new THREE.Box3().setFromObject(g.scene);
  const c = box.getCenter(new THREE.Vector3());
  group.position.set(-c.x, -c.y, -c.z);           // 머리를 원점으로
  eyes = [makeEye(3.41), makeEye(-3.5)];
  camera.position.set(0, 1.5, 80);
  camera.lookAt(0, 0, 0);
  setStatus("");
}, undefined, e => setStatus("모델 로드 실패: " + e, true));

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = 1; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);

// 드래그로 헤드 회전
let dragging = false, px = 0, py = 0, userYaw = 0, userPitch = 0;
canvas.addEventListener("pointerdown", e => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener("pointerup", () => dragging = false);
addEventListener("pointermove", e => {
  if (!dragging) return;
  userYaw += (e.clientX - px) * 0.005; userPitch += (e.clientY - py) * 0.003;
  userPitch = Math.max(-0.4, Math.min(0.4, userPitch));
  px = e.clientX; py = e.clientY;
});

// ---------- 상태 (퍼펫과 동일 구조 — 공유 코어 소비) ----------
let anim = null, smooth = {};
const W = k => smooth[k] || 0;
let nod = 0;

const cursor = AvatarCore.makeCursorTracker(canvas);
const gaze = AvatarCore.makeGaze(cursor, { mulX: 0.8, mulY: 0.5 });
const blinker = AvatarCore.makeBlink({
  autoBlink: () => $("autoBlink").checked,
  intervalMs: () => 3500, duration: 150, jitter: 0.8,
});
const emo = AvatarCore.makeEmotion(document.querySelectorAll("#emotions button"), "#76b900");
$("blinkBtn").onclick = () => blinker.trigger();

// ---------- 웹캠 미러링 (코어 makeMirror — MediaPipe 블렌드셰이프 → mark 모프타깃) ----------
const mirror = AvatarCore.makeMirror({
  onStatus: setStatus,
});
const mpanel = AvatarCore.makeMirrorPanel(mirror, $("panel"));   // 비교군 분석 패널 (코어 공용)
$("mirrorBtn").onclick = () => {
  if (mirror.on) { mirror.stop(); $("mirrorBtn").classList.remove("on"); $("panel").style.display = "none"; return; }
  mirror.start().then(() => { $("mirrorBtn").classList.add("on"); $("panel").style.display = ""; })
    .catch(e => { mirror.stop(); $("mirrorBtn").classList.remove("on"); setStatus("미러링 실패: " + e.message, true); });
};

// ---------- 렌더 루프 ----------
function render(now) {
  requestAnimationFrame(render);
  if (!mesh) return;

  AvatarCore.smoothStep(smooth, AvatarCore.weightsFromAnim(anim, audio));
  mirror.apply(smooth, now);
  mpanel.draw(W);   // 트래킹 미리보기
  smooth.jawopen = Math.max(smooth.jawopen || 0, +$("ovJaw").value);
  const smileOv = +$("ovSmile").value, browOv = +$("ovBrow").value;
  for (const k of ["mouthsmileleft", "mouthsmileright"]) smooth[k] = Math.max(smooth[k] || 0, smileOv);
  for (const k of ["browinnerup", "browouterupleft", "browouterupright"]) smooth[k] = Math.max(smooth[k] || 0, browOv);
  if (anim && anim.emotionTrack && !audio.paused && !audio.ended) emo.followTrack(anim.emotionTrack, audio.currentTime);
  emo.applyMax(smooth, !!(anim && !audio.paused && !audio.ended));   // 발화 중이면 감정 유지, 유휴면 자동 감정 감쇠
  const blink = Math.max(blinker.value(now), +$("ovBlink").value, W("eyeblinkleft"), W("eyeblinkright"));

  // 모프 적용 (실제 3D 근육)
  const inf = mesh.morphTargetInfluences;
  for (const [k, idx] of morphMap) {
    inf[idx] = k === "eyeblinkleft" || k === "eyeblinkright" ? blink : (smooth[k] || 0);
  }

  const [gsx, gsy] = gaze(+$("ovGaze").value, W);  // 슬라이더 > 엔진 채널 > 커서
  for (const e of eyes) e.rotation.set(gsy * 0.3, gsx * 0.4, 0);

  // 머리: 사용자 드래그 + 발화 중 미세 끄덕임 + 엔진 head pose(있을 때만 — 현 체크포인트는 미출력)
  nod = 0.85 * nod + 0.15 * W("jawopen");
  let hYaw = 0, hPitch = 0, hRoll = 0;
  if (anim && anim.head && !audio.paused && !audio.ended) {
    const hf = anim.head[Math.min(Math.floor(audio.currentTime * anim.fps), anim.head.length - 1)];
    hYaw = hf[0] * Math.PI / 180; hPitch = hf[1] * Math.PI / 180; hRoll = hf[2] * Math.PI / 180;
  }
  // 토글 ON 이면 웹캠 머리 자세를 위에 얹는다 (OFF 면 기존 동작 그대로)
  const h = $("headMove").checked ? mirror.head() : null;
  if (h) group.rotation.set(userPitch + nod * 0.04 + hPitch + h[1], userYaw + hYaw + h[0], hRoll + h[2]);
  else group.rotation.set(userPitch + nod * 0.04 + hPitch, userYaw + hYaw, hRoll);

  renderer.render(scene, camera);
}
requestAnimationFrame(render);

// ---------- 발화 (퍼펫과 동일 API) ----------
const speak = (text, emotion) => AvatarCore.speakWithEmotion({
  text, emotion, autoEmo: $("autoEmo").checked, emo,
  voice: $("voice").value, engine: $("engine").value,
  audioEl: audio, onAnim: a => { anim = a; },
});

// ---------- 대화 모드 (퍼펫과 동일 흐름; 코어가 소유) ----------
const chatCtl = AvatarCore.makeChat({
  speak, logEl: $("chatlog"), botName: "mark", placeholderOn: "mark에게 말을 걸어보세요…",
  chatModeEl: $("chatMode"), clearBtnEl: $("clearChat"), textEl: $("text"),
  sendEl: $("send"), micBtnEl: $("micBtn"), formEl: $("form"), statusSet: setStatus,
  // mark 3D 헤드는 캐릭터 전환이 없어 고정 성격
  getPersona: () => "너는 3D로 정교하게 빚어진 차분하고 지적인 아바타 mark 야. 또렷하고 침착하게 말한다.",
  audioEl: audio,   // 연속 대화: 응답 재생이 끝나야 재청취
});

$("form").onsubmit = async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("send").disabled = true;
  $("text").value = "";
  setStatus("생성 중…");
  try {
    if ($("chatMode").checked) await chatCtl.runChat(text);
    else await speak(text);
    setStatus("");
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $("send").disabled = false;
  }
};

fetch("/api/health").then(r => r.json()).then(h => {
  if (!h.chat) { $("chatRow").style.display = "none"; $("micBtn").style.display = "none"; }
});
</script>
</body>
</html>
