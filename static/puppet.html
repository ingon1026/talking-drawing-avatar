<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 퍼펫 아바타</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #16161d; color: #e8e8ef;
  }
  main { width: min(560px, 94vw); padding: 24px 0 48px; }
  h1 { font-size: 1.2rem; font-weight: 600; margin: 16px 0; display: flex; justify-content: space-between; align-items: center; }
  h1 a { color: #9a9ab0; font-size: .85rem; text-decoration: none; }
  .stage {
    width: 100%; aspect-ratio: 1; background: #fff; position: relative;
    border-radius: 16px; overflow: hidden; border: 1px solid #2a2a35;
  }
  .warp-shake { position: absolute; inset: 0; will-change: transform; }
  .warp-shake canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { z-index: 0; }
  #cv { z-index: 1; }
  /* 3D 스테이지 — 2D 와 형제로 두고 한쪽만 표시한다 (배경은 어둡게, 드래그로 헤드 회전) */
  #stage3d { background: #0d0d12; cursor: grab; }
  #cv3d { width: 100%; height: 100%; display: block; }
  form { display: flex; gap: 8px; margin-top: 16px; }
  input[type=text] {
    flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2a35;
    background: #0d0d12; color: inherit; font-size: 1rem;
  }
  button, select {
    height: 38px; padding: 0 14px; border-radius: 9px; font-size: .9rem;
    background: #21212b; color: inherit; border: 1px solid #2f2f3c; cursor: pointer;
  }
  button.primary { background: #5b8cff; border-color: #5b8cff; color: #fff; }
  button:disabled { background: #26262f; color: #666; cursor: default; }
  .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  /* 토글 줄 — 체크박스는 설정이라 본문보다 한 톤 낮춘다 */
  .toggles { gap: 16px; margin-top: 12px; font-size: .85rem; color: #9a9ab0; }
  .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #emotions button { padding: 0 12px; }
  #status { margin-top: 12px; color: #9a9ab0; font-size: .9rem; min-height: 1.2em; }
  #status.error { color: #ff7a7a; }
  #chatlog {
    margin-top: 14px; display: grid; gap: 8px; max-height: 220px; overflow-y: auto;
    padding: 12px; background: #0d0d12; border: 1px solid #2a2a35; border-radius: 12px;
  }
  #chatlog .turn { font-size: .9rem; line-height: 1.45; }
  #chatlog .who { font-size: .75rem; color: #767888; margin-right: 6px; }
  #chatlog .me { color: #b9c6e8; }
  #chatlog .bot { color: #e8e8ef; }
  #micBtn.on { background: #e2647e; }
</style>
<!-- GLTFLoader.js 가 `from 'three'` 로 three 를 참조한다 — 이 importmap 이 없으면 3D 로더가 로드 실패한다.
     워프(makeWarp)가 쓰는 URL 과 같은 모듈이라 브라우저 모듈 캐시를 공유한다. -->
<script type="importmap">{ "imports": { "three": "/static/vendor/three.module.js" } }</script>
</head>
<body>
<main>
  <h1>실시간 퍼펫 아바타 <span><a href="/">영상 모드</a></span></h1>

  <div class="stage" id="stage2d"><div class="warp-shake" id="shake">
    <canvas id="gl" width="512" height="512"></canvas>
    <canvas id="cv" width="512" height="512"></canvas>
  </div></div>
  <div class="stage" id="stage3d" style="display:none"><canvas id="cv3d"></canvas></div>

  <form id="form">
    <button id="micBtn" type="button" title="마이크로 말 걸기" style="display:none">음성</button>
    <input id="text" type="text" placeholder="캐릭터가 말할 문장을 입력하세요…" autocomplete="off">
    <button id="send" type="submit" class="primary">말하기</button>
  </form>

  <div class="row" id="emotions">
    <button type="button" data-emo="neutral">기본</button>
    <button type="button" data-emo="joy">기쁨</button>
    <button type="button" data-emo="sad">슬픔</button>
    <button type="button" data-emo="angry">화남</button>
    <button type="button" data-emo="surprise">놀람</button>
    <button type="button" data-emo="fear">무서움</button>
    <button type="button" data-emo="shy">수줍음</button>
  </div>

  <div class="row">
    <select id="character"></select>
    <select id="voice">
      <option value="ko-KR-InJoonNeural">인준 (남성)</option>
      <option value="ko-KR-HyunsuMultilingualNeural">현수 (남성)</option>
      <option value="ko-KR-SunHiNeural">선히 (여성)</option>
    </select>
    <select id="engine">
      <option value="neurosync">빠른 엔진 (NeuroSync, ~0.5초)</option>
      <option value="a2f">NVIDIA 3D 엔진 (Audio2Face-3D, ~3초)</option>
    </select>
    <button type="button" id="addChar" title="내가 그린 그림·사진을 캐릭터로 등록합니다. 올린 뒤 눈·입을 4번 지정하면 완성됩니다.">그림 추가</button>
    <button type="button" id="delChar" style="display:none">삭제</button>
    <button type="button" id="clearChat" style="display:none">대화 지우기</button>
    <input type="file" id="charFile" accept="image/*" style="display:none">
  </div>

  <div class="row toggles">
    <label><input type="checkbox" id="chatMode"> 대화 모드</label>
    <label><input type="checkbox" id="autoEmo" checked> 감정 자동</label>
    <label><input type="checkbox" id="autoBlink" checked> 자동 깜빡임</label>
    <label><input type="checkbox" id="warpToggle" checked> 얼굴 워핑</label>
  </div>

  <div id="chatlog" style="display:none"></div>
  <div id="status"></div>
  <audio id="audio"></audio>

</main>

<script src="/static/avatar_core.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d"), audio = $("audio");
const glCanvas = $("gl"), shakeEl = $("shake"), warpToggle = $("warpToggle");
const setStatus = AvatarCore.bindStatus($("status"));

// ---------- 캐릭터 에셋 로드 (파일명 규칙 기반) ----------
const PART_FILES = ["base", "brow_L", "brow_R", "eye_L_open", "eye_R_open",
  "eye_L_closed", "eye_R_closed", "pupil_L", "pupil_R",
  "mouth_closed", "mouth_M", "mouth_A", "mouth_E", "mouth_I", "mouth_O", "mouth_U"];
// 기본값에 새 manifest 를 얹는다. 예전엔 직전 캐릭터의 manifest 에 얹어서, 새 캐릭터가
// 안 적은 키(eyeHalf 등)에 앞 캐릭터 값이 그대로 남아 눈 위치·크기가 어긋났다.
const MANIFEST_DEFAULTS = { pupilRange: 7, browRange: 10, jawDrop: 8 };
let parts = {}, manifest = { ...MANIFEST_DEFAULTS };

async function loadCharacter(id) {
  const dir = `/characters/${id}`;
  try {
    manifest = { ...MANIFEST_DEFAULTS, ...(await fetch(`${dir}/manifest.json`).then(r => r.json())) };
  } catch { manifest = { ...MANIFEST_DEFAULTS }; }
  const loaded = {};
  await Promise.all(PART_FILES.map(name => new Promise(res => {
    const img = new Image();
    img.onload = () => { loaded[name] = img; res(); };
    img.onerror = () => res();  // 없는 파츠는 생략
    img.src = `${dir}/${name}.png`;
  })));
  parts = loaded;
  warp.setCharacter();  // 워프 준비됐으면 새 base 텍스처·커널 중심 반영 (준비 전이면 no-op, init이 이어받음)
}

// 3D 헤드는 서버 캐릭터 목록에 없는 고정 항목 — 드롭다운 값이 2D/3D 모드의 단일 진실이다.
const MARK3D = "__mark3d__";
const is3D = () => $("character").value === MARK3D;

let charList = [];
async function initCharacters(selectId) {
  const list = await fetch("/api/characters").then(r => r.json());
  charList = list;
  const sel = $("character");
  sel.innerHTML = list.map(c => `<option value="${c.id}">${c.name}</option>`).join("")
    + `<option value="${MARK3D}">석고상 (NVIDIA mark · 3D)</option>`;
  sel.onchange = applyMode;
  const pick = selectId && [...sel.options].some(o => o.value === selectId)
    ? selectId : (list.length ? list[0].id : MARK3D);
  sel.value = pick;
  await applyMode();
}

// 모드 전환: 스테이지 표시/숨김 + 해당 모드의 에셋 로드. 드롭다운 변경과 초기 진입이 같은 경로를 탄다.
async function applyMode() {
  const on3d = is3D();
  $("stage3d").style.display = on3d ? "" : "none";
  $("stage2d").style.display = on3d ? "none" : "";
  // 그림 추가(어노테이터)는 2D 캔버스(#cv)에 그리므로 3D 에선 숨긴다
  $("addChar").style.display = on3d ? "none" : "";
  updateDelBtn();
  if (on3d) await ensure3D().catch(e => setStatus("3D 로드 실패: " + e.message, true));
  else await loadCharacter($("character").value);
}

function updateDelBtn() {
  const c = charList.find(c => c.id === $("character").value);
  $("delChar").style.display = c && c.deletable ? "" : "none";
}
$("delChar").onclick = async () => {
  const id = $("character").value;
  if (!confirm("이 캐릭터를 삭제할까요?")) return;
  const res = await fetch(`/api/characters/${id}`, { method: "DELETE" });
  if (res.ok) { await initCharacters(); setStatus("삭제했습니다."); }
  else setStatus((await res.json()).detail || "삭제 실패", true);
};

// ---------- 블렌드셰이프 상태 ----------
let anim = null;          // {fps, frames, index(names→col)} 재생 중인 발화
let smooth = {};          // 지수 평활된 현재 가중치
let jawGain = 1;   // shapeAnim 이 이번 발화에 적용한 jawopen 증폭 — 발화 중에만 되돌린다
const W = k => (k === "jawopen" ? (smooth[k] || 0) / jawGain : (smooth[k] || 0));

const stage = $("stage2d");   // .stage 는 이제 2D·3D 두 개라 id 로 명시

// ---------- 공유 렌더 코어 인스턴스 (avatar_core.js) ----------
const emo = AvatarCore.makeEmotion(document.querySelectorAll("#emotions button"), "#5b8cff");
const blinker = AvatarCore.makeBlink({
  autoBlink: () => $("autoBlink").checked,
  intervalMs: () => 4000,
  duration: 140, jitter: 0.6,
});
const cursor = AvatarCore.makeCursorTracker(stage);
const gaze = AvatarCore.makeGaze(cursor, { mulX: 0.9, mulY: 0.6 });
const headWander = AvatarCore.makeHeadWander();
const mouthPicker = AvatarCore.makeMouthPicker(W);
const warp = AvatarCore.makeWarp({
  threeUrl: "/static/vendor/three.module.js", glCanvas,
  getParts: () => parts, getManifest: () => manifest, W,
});
const annotator = AvatarCore.makeAnnotator({
  cv, ctx, setStatus, needDataUrl: true,
  onCreate: async (annot, name, done) => {   // 서버 POST → character_builder 로 캐릭터 생성
    const eyeR = Math.max(6, 0.03 * Math.max(annot.iw, annot.ih));
    // 실눈 캐릭터는 눈이 이미 감긴 선이라 눈꺼풀 연출이 선을 토막낸다 — 그림만 보고
    // 자동 판별하려 했지만 작은 눈과 안 갈려서 등록할 때 한 번 묻는다.
    const eyeBlink = !confirm("이 그림은 눈을 감고 있나요?\n\n확인 = 실눈 캐릭터 (깜빡임을 끕니다)\n취소 = 보통 눈");
    const body = {
      name, image_b64: annot.dataUrl, eye_blink: eyeBlink,
      eye_l: [...annot.eyeL, eyeR], eye_r: [...annot.eyeR, eyeR],
      mouth_box: annot.box, mouth_center: annot.mouthC,
    };
    setStatus("캐릭터 생성 중…");
    try {
      const res = await fetch("/api/characters/create", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
      const { id } = await res.json();
      done();
      await initCharacters(id);
      setStatus("✅ 캐릭터가 추가됐어요. 문장을 입력해보세요!");
    } catch (err) { setStatus(err.message, true); }
  },
});

// 드래그앤드랍·파일 입력 (어노테이터로 위임)
stage.addEventListener("dragover", e => e.preventDefault());
stage.addEventListener("drop", e => { e.preventDefault(); annotator.acceptFile(e.dataTransfer.files[0]); });
// 캐릭터 클릭 반응: 아바타를 누르면 감정 섞인 한마디
stage.style.cursor = "pointer";
stage.addEventListener("click", () => {
  if (annotator.active()) return;   // 4클릭 어노테이션 중엔 좌표 클릭이라 제외
  const r = AvatarCore.pickReaction();
  emo.setEmotion(r.emo, 0.95, false);
  setStatus("💬 " + r.text);
  speak(r.text, r.emo);
});
$("addChar").onclick = () => $("charFile").click();
$("charFile").onchange = e => { annotator.acceptFile(e.target.files[0]); e.target.value = ""; };


// ---------- 3D 헤드 (석고상 mark) ----------
// three 자체는 워프가 이미 받아오지만, GLTFLoader(108KB)·mark.glb(41MB)·WebGLRenderer 씬 구성은
// 3D 캐릭터를 처음 고르는 순간까지 미룬다 — 2D 만 쓰는 사용자가 41MB 를 내려받지 않게.
const canvas3d = $("cv3d");
let three3d = null;    // { THREE, renderer, scene, camera, group } — 최초 1회만 구성
let mounted = null;    // mountHead3D 결과 { sceneNode, morphMeshes, eyes }
let init3d = null;     // 진행 중인 초기화 프라미스 (전환을 오가도 중복 로드 방지)
const ensure3D = () => (init3d ||= init3D().catch(e => { init3d = null; throw e; }));

async function init3D() {
  setStatus("3D 모델 로딩 중… (41MB, 최초 1회)");
  const THREE = await import("three");
  const { GLTFLoader } = await import("/static/vendor/GLTFLoader.js");

  const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0d12);
  const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 1000);
  scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x2a2018, 1.1));
  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1.5, 2, 3); scene.add(key);
  const rim = new THREE.DirectionalLight(0x77aaff, 1.0); rim.position.set(-2, 1, -2); scene.add(rim);
  const group = new THREE.Group();
  scene.add(group);

  const resize = () => {
    const r = canvas3d.parentElement.getBoundingClientRect();
    if (!r.width) return;   // 2D 모드라 숨겨진 동안엔 0 — 그때 setSize 하면 캔버스가 0으로 죽는다
    renderer.setSize(r.width, r.height, false);
    camera.aspect = 1; camera.updateProjectionMatrix();
  };
  new ResizeObserver(resize).observe(canvas3d.parentElement);

  const gltf = await new Promise((res, rej) => new GLTFLoader().load(
    "/static/assets3d/mark.glb", res, undefined, () => rej(new Error("mark.glb 를 받지 못했습니다"))));
  // 프레이밍·눈알 구체·모프 수집은 코어에 있다 (headFrac 1 = 머리만 있는 석고 모델)
  const r = AvatarCore.mountHead3D(THREE, { group, camera, gltf, cfg: { eyeSpheres: true, headFrac: 1 }, prev: null });
  if (!r) throw new Error("이 모델에 표정 모프가 없습니다");
  mounted = r;
  three3d = { THREE, renderer, scene, camera, group };
  resize();
  setStatus("");
}

// 드래그로 헤드 회전 (3D 전용 상태 — 2D 에선 읽히지 않는다)
let dragging = false, px = 0, py = 0, userYaw = 0, userPitch = 0, nod = 0;
canvas3d.addEventListener("pointerdown", e => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener("pointerup", () => dragging = false);
addEventListener("pointermove", e => {
  if (!dragging) return;
  userYaw += (e.clientX - px) * 0.005; userPitch += (e.clientY - py) * 0.003;
  userPitch = Math.max(-0.4, Math.min(0.4, userPitch));
  px = e.clientX; py = e.clientY;
});
const gaze3d = AvatarCore.makeGaze(AvatarCore.makeCursorTracker(canvas3d), { mulX: 0.8, mulY: 0.5 });

// ---------- 렌더 루프 ----------

// 두 모드가 공유하는 구간은 "표정 파이프라인" 전체 — smoothStep · jawGain 되돌리기 · 슬라이더
// 오버라이드 · followTrack · applyMax · blink. 여기까지가 렌더러와 무관한 채널값 계산이고,
// 그 아래부터가 3D 모프 / 2D 픽셀로 갈라지는 지점이라 분기를 정확히 여기에 둔다.
function render(now) {
  requestAnimationFrame(render);
  if (annotator.active()) {   // 어노테이션은 2D 캔버스 전용 (3D 에선 addChar 자체를 숨김)
    shakeEl.style.transform = "none";       // 어노테이션 중엔 흔들림 없음 (getBoundingClientRect 정합 유지)
    glCanvas.style.visibility = "hidden";   // 워프 캔버스 숨김
    annotator.draw();
    return;
  }
  if (is3D() ? !mounted : !parts.base) return;

  // 평활 (비짐 떨림 방지 — 자음 반응성을 위해 빠르게, 매 프레임 무할당)
  AvatarCore.smoothStep(smooth, AvatarCore.weightsFromAnim(anim, audio));
  // shapeAnim이 이번 발화에 적용한 jawopen 증폭을 되돌려 2D 소비자(입 크기·이 몸짓 임계값)에
  // 넘긴다 — 3D 모프용 보정이라 2D 픽셀 공식은 원래(증폭 전) 스케일 그대로 써야 함.
  // audio 재생 중일 때만 적용: 끝난 뒤엔 smooth.jawopen 이 미러(웹캠) 단독 값이 되므로,
  // 그때도 나누면 실제 미러링 입벌림까지 줄어드는 회귀가 생긴다.
  jawGain = (anim && !audio.paused && !audio.ended) ? (anim.jawGain || 1) : 1;

  // 문장이 바뀌면 표정도 따라 전환 (발화 중에만) — applyMax·headWander 보다 먼저 갱신
  if (anim && anim.emotionTrack && !audio.paused && !audio.ended) emo.followTrack(anim.emotionTrack, audio.currentTime);
  emo.applyMax(smooth, !!(anim && !audio.paused && !audio.ended));   // 발화 중이면 감정 유지, 유휴면 자동 감정 감쇠
  const blink = Math.max(blinker.value(now), W("eyeblinkleft"), W("eyeblinkright"));

  // ===== 여기부터 렌더러별 분기 =====
  if (is3D()) {
    // 3D: 모프 = 실제 근육. applyMorphs 는 smooth 를 그대로 읽으므로 jawGain 증폭이 살아 있다
    // (증폭은 원래 3D 모프용 보정이라 여기선 되돌리지 않는 게 맞다 — 되돌리는 건 2D 픽셀 공식뿐).
    AvatarCore.applyMorphs(mounted.morphMeshes, smooth, blink);
    const [gsx, gsy] = gaze3d(0, W);   // 엔진 채널 > 커서
    for (const e of mounted.eyes) e.rotation.set(gsy * 0.3, gsx * 0.4, 0);

    // 머리: 사용자 드래그 + 발화 중 미세 끄덕임 + 엔진 head pose(있을 때만 — 현 체크포인트는 미출력)
    nod = 0.85 * nod + 0.15 * (smooth.jawopen || 0);   // 끄덕임도 3D 스케일(증폭 후) 기준
    let hYaw = 0, hPitch = 0, hRoll = 0;
    if (anim && anim.head && !audio.paused && !audio.ended) {
      const hf = anim.head[Math.min(Math.floor(audio.currentTime * anim.fps), anim.head.length - 1)];
      hYaw = hf[0] * Math.PI / 180; hPitch = hf[1] * Math.PI / 180; hRoll = hf[2] * Math.PI / 180;
    }
    three3d.group.rotation.set(userPitch + nod * 0.04 + hPitch, userYaw + hYaw, hRoll);
    three3d.renderer.render(three3d.scene, three3d.camera);
    return;   // headWander(2D 전용 CSS 변환)·워프·파츠 드로잉은 3D 에서 돌면 안 된다
  }

  // 머리 움직임: 발화 에너지(끄덕임) + 느린 표류 + 잔잔한 사인
  const sway = anim && !audio.paused ? 1 : 0.5;
  headWander(shakeEl, now, W("jawopen"), sway, emo.current());   // 감정 → 몸짓 연동

  const warpOn = warp.ready && warpToggle.checked;
  if (warpOn) { glCanvas.style.visibility = "visible"; warp.render(); }
  else { glCanvas.style.visibility = "hidden"; }

  ctx.clearRect(0, 0, 512, 512);
  const draw = (name, dx = 0, dyy = 0) => parts[name] && ctx.drawImage(parts[name], dx, dyy);

  if (!warpOn) draw("base");   // 워프 OFF/미지원: base를 2D로 그림 (폴백). ON이면 WebGL이 담당.
  // 눈썹 각도·연속 눈꺼풀은 코어가 담당한다 — 여기에 다시 적으면 코어 개선이 이 페이지에
  // 반영되지 않는다(실제로 그렇게 갈라져 있었다).
  AvatarCore.drawFaceParts(ctx, {
    parts, manifest, W, blink, gaze: gaze(0, W),   // 엔진 채널 > 커서
  });
  const jawDy = warp.jawOverlayDy(W("jawopen"), warpOn, manifest);
  if (manifest.proceduralMouth) {
    AvatarCore.drawVectorMouth(ctx, W, manifest, jawDy);  // 근육 채널 직접 구동 (기본)
  } else {
    AvatarCore.drawSpriteMouth(ctx, parts, mouthPicker, now, jawDy);  // 스프라이트 크로스페이드
  }
}
requestAnimationFrame(render);

// ---------- 발화 (감정 프리셋 + 목소리 톤 적용 후 재생) ----------
const speak = (text, emotion) => AvatarCore.speakWithEmotion({
  text, emotion, autoEmo: $("autoEmo").checked, emo,
  voice: $("voice").value, engine: $("engine").value,
  audioEl: audio, onAnim: a => { anim = a; },
});

// ---------- 대화 모드 (마이크/입력 → LLM → 아바타 응답; 코어가 소유) ----------
const chatCtl = AvatarCore.makeChat({
  speak, logEl: $("chatlog"), botName: "아바타", placeholderOn: "아바타에게 말을 걸어보세요…",
  chatModeEl: $("chatMode"), clearBtnEl: $("clearChat"), textEl: $("text"),
  sendEl: $("send"), micBtnEl: $("micBtn"), formEl: $("form"), statusSet: setStatus,
  // 선택된 캐릭터 성격을 대화에 반영 — 3D 헤드는 캐릭터 매니페스트가 없어 고정 성격
  getPersona: () => is3D()
    ? "너는 3D로 정교하게 빚어진 차분하고 지적인 아바타 mark 야. 또렷하고 침착하게 말한다."
    : manifest.persona,
  audioEl: audio,   // 연속 대화: 응답 재생이 끝나야 재청취
});

$("form").onsubmit = async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  // 어노테이션이 끝나야 캐릭터가 만들어진다 — 그 전엔 렌더가 어노테이션 화면이라
  // 발화해도 아무 반응이 없는 것처럼 보인다.
  if (annotator.active()) { setStatus("눈·입 지정을 먼저 끝내주세요 (ESC로 취소)", true); return; }
  $("send").disabled = true;
  $("text").value = "";
  setStatus("생성 중…");
  try {
    if ($("chatMode").checked) await chatCtl.runChat(text);
    else await speak(text);
    setStatus("");
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $("send").disabled = false;
  }
};

warp.init();   // WebGL 워프 초기화 (실패 시 조용히 폴백). loadCharacter와 경쟁은 양방향 처리됨.
// 딥링크: ?char=<캐릭터 id|__mark3d__> — /3d 리다이렉트가 이 파라미터로 3D 모드에 바로 진입한다
initCharacters(new URLSearchParams(location.search).get("char"));
fetch("/api/health").then(r => r.json()).then(h => {
  if (!h.a2f) document.querySelector('#engine option[value="a2f"]')?.remove();
  // JoyVASA 없으면 "/" 가 이 페이지를 서빙하므로 영상 모드 링크(h1 의 유일한 링크)를 지운다
  if (!h.joyvasa_ready) document.querySelector("h1 a")?.remove();
  if (!h.chat) {   // 대화 백엔드 없으면 대화 UI 숨김
    $("chatMode").closest("label").style.display = "none";
    $("micBtn").style.display = "none";
  }
});
</script>
</body>
</html>
