<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 퍼펫 아바타</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #16161d; color: #e8e8ef;
  }
  main { width: min(560px, 94vw); padding: 24px 0 48px; }
  h1 { font-size: 1.2rem; font-weight: 600; margin: 16px 0; display: flex; justify-content: space-between; align-items: center; }
  h1 a { color: #9a9ab0; font-size: .85rem; text-decoration: none; }
  .stage {
    width: 100%; aspect-ratio: 1; background: #fff; position: relative;
    border-radius: 16px; overflow: hidden; border: 1px solid #2a2a35;
  }
  .warp-shake { position: absolute; inset: 0; will-change: transform; }
  .warp-shake canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { z-index: 0; }
  #cv { z-index: 1; }
  form { display: flex; gap: 8px; margin-top: 16px; }
  input[type=text] {
    flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2a35;
    background: #0d0d12; color: inherit; font-size: 1rem;
  }
  button {
    padding: 10px 16px; border-radius: 10px; border: 0; background: #5b8cff;
    color: #fff; font-size: .95rem; cursor: pointer;
  }
  button:disabled { background: #333; cursor: default; }
  button.alt { background: #2a2a35; }
  .row { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .controls { margin-top: 16px; display: grid; gap: 10px; font-size: .88rem; }
  .controls label { display: flex; align-items: center; gap: 10px; }
  .controls label span.k { width: 88px; color: #9a9ab0; }
  .controls input[type=range] { flex: 1; }
  select { padding: 8px; border-radius: 8px; background: #0d0d12; color: inherit; border: 1px solid #2a2a35; }
  #status { margin-top: 12px; color: #9a9ab0; font-size: .9rem; min-height: 1.2em; }
  #status.error { color: #ff7a7a; }
  #chatlog {
    margin-top: 14px; display: grid; gap: 8px; max-height: 220px; overflow-y: auto;
    padding: 12px; background: #0d0d12; border: 1px solid #2a2a35; border-radius: 12px;
  }
  #chatlog .turn { font-size: .9rem; line-height: 1.45; }
  #chatlog .who { font-size: .75rem; color: #767888; margin-right: 6px; }
  #chatlog .me { color: #b9c6e8; }
  #chatlog .bot { color: #e8e8ef; }
  #micBtn.on { background: #e2647e; }
</style>
</head>
<body>
<main>
  <h1>🎭 실시간 퍼펫 아바타 <span><a href="/3d" style="color:#76b900">NVIDIA 3D 스튜디오 →</a> &nbsp; <a href="/">영상 모드</a></span></h1>

  <div class="stage"><div class="warp-shake" id="shake">
    <canvas id="gl" width="512" height="512"></canvas>
    <canvas id="cv" width="512" height="512"></canvas>
  </div></div>

  <form id="form">
    <button id="micBtn" type="button" class="alt" title="마이크로 말 걸기" style="display:none">🎤</button>
    <input id="text" type="text" placeholder="캐릭터가 말할 문장을 입력하세요…" autocomplete="off">
    <button id="send" type="submit">말하기</button>
  </form>
  <div class="row" id="chatRow">
    <label><input type="checkbox" id="chatMode"> 💬 대화 모드 <span style="color:#767888;font-size:.82rem">(내 말에 아바타가 대답)</span></label>
    <button type="button" class="alt" id="clearChat" style="display:none">대화 지우기</button>
  </div>

  <div class="row" id="emotions">
    <span style="color:#9a9ab0;font-size:.88rem">감정:</span>
    <button type="button" class="alt" data-emo="neutral">😐 기본</button>
    <button type="button" class="alt" data-emo="joy">😊 기쁨</button>
    <button type="button" class="alt" data-emo="sad">😢 슬픔</button>
    <button type="button" class="alt" data-emo="angry">😠 화남</button>
    <button type="button" class="alt" data-emo="surprise">😲 놀람</button>
    <button type="button" class="alt" data-emo="fear">😱 무서움</button>
    <button type="button" class="alt" data-emo="shy">😳 수줍음</button>
    <label><input type="checkbox" id="autoEmo" checked> 감정 자동</label>
  </div>

  <div class="row">
    <button type="button" class="alt" id="blinkBtn">👁 지금 깜빡!</button>
    <label><input type="checkbox" id="autoBlink" checked> 자동 깜빡임</label>
    <label><input type="checkbox" id="warpToggle" checked> 얼굴 워핑</label>
    <select id="voice">
      <option value="ko-KR-SunHiNeural">선히 (여성)</option>
      <option value="ko-KR-InJoonNeural">인준 (남성)</option>
      <option value="ko-KR-HyunsuMultilingualNeural">현수 (남성)</option>
    </select>
    <select id="engine">
      <option value="neurosync">빠른 엔진 (NeuroSync, ~0.5초)</option>
      <option value="a2f">NVIDIA 3D 엔진 (Audio2Face-3D, ~3초)</option>
    </select>
    <select id="character"></select>
    <button type="button" class="alt" id="addChar">➕ 그림 추가</button>
    <button type="button" class="alt" id="delChar" style="display:none">🗑 삭제</button>
    <input type="file" id="charFile" accept="image/*" style="display:none">
  </div>

  <div class="controls">
    <label><span class="k">깜빡임 간격</span><input id="blinkInterval" type="range" min="1" max="10" step="0.5" value="4"><span id="blinkIntervalVal">4초</span></label>
    <label><span class="k">눈 감기</span><input id="ovBlink" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label><span class="k">입 벌림</span><input id="ovJaw" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label><span class="k">미소</span><input id="ovSmile" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label><span class="k">눈썹 올림</span><input id="ovBrow" type="range" min="0" max="1" step="0.01" value="0"></label>
    <label><span class="k">시선 좌우</span><input id="ovGaze" type="range" min="-1" max="1" step="0.01" value="0"></label>
  </div>

  <div id="chatlog" style="display:none"></div>
  <div id="status"></div>
  <audio id="audio"></audio>
</main>

<script src="/static/avatar_core.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d"), audio = $("audio");
const glCanvas = $("gl"), shakeEl = $("shake"), warpToggle = $("warpToggle");
const setStatus = AvatarCore.bindStatus($("status"));

// ---------- 캐릭터 에셋 로드 (파일명 규칙 기반) ----------
const PART_FILES = ["base", "brow_L", "brow_R", "eye_L_open", "eye_R_open",
  "eye_L_closed", "eye_R_closed", "pupil_L", "pupil_R",
  "mouth_closed", "mouth_M", "mouth_A", "mouth_E", "mouth_I", "mouth_O", "mouth_U"];
let parts = {}, manifest = { pupilRange: 7, browRange: 10, jawDrop: 8 };

async function loadCharacter(id) {
  const dir = `/characters/${id}`;
  try { manifest = { ...manifest, ...(await fetch(`${dir}/manifest.json`).then(r => r.json())) }; } catch {}
  const loaded = {};
  await Promise.all(PART_FILES.map(name => new Promise(res => {
    const img = new Image();
    img.onload = () => { loaded[name] = img; res(); };
    img.onerror = () => res();  // 없는 파츠는 생략
    img.src = `${dir}/${name}.png`;
  })));
  parts = loaded;
  warp.setCharacter();  // 워프 준비됐으면 새 base 텍스처·커널 중심 반영 (준비 전이면 no-op, init이 이어받음)
}

let charList = [];
async function initCharacters(selectId) {
  const list = await fetch("/api/characters").then(r => r.json());
  charList = list;
  const sel = $("character");
  sel.innerHTML = list.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
  sel.onchange = () => { loadCharacter(sel.value); updateDelBtn(); };
  const pick = selectId || (list.length && list[0].id);
  if (pick) { sel.value = pick; await loadCharacter(pick); }
  updateDelBtn();
}

function updateDelBtn() {
  const c = charList.find(c => c.id === $("character").value);
  $("delChar").style.display = c && c.deletable ? "" : "none";
}
$("delChar").onclick = async () => {
  const id = $("character").value;
  if (!confirm("이 캐릭터를 삭제할까요?")) return;
  const res = await fetch(`/api/characters/${id}`, { method: "DELETE" });
  if (res.ok) { await initCharacters(); setStatus("삭제했습니다."); }
  else setStatus((await res.json()).detail || "삭제 실패", true);
};

// ---------- 블렌드셰이프 상태 ----------
let anim = null;          // {fps, frames, index(names→col)} 재생 중인 발화
let smooth = {};          // 지수 평활된 현재 가중치
const W = k => smooth[k] || 0;

const stage = document.querySelector(".stage");

// ---------- 공유 렌더 코어 인스턴스 (avatar_core.js) ----------
const emo = AvatarCore.makeEmotion(document.querySelectorAll("#emotions button"), "#5b8cff");
const blinker = AvatarCore.makeBlink({
  autoBlink: () => $("autoBlink").checked,
  intervalMs: () => +$("blinkInterval").value * 1000,
  duration: 140, jitter: 0.6,
});
const cursor = AvatarCore.makeCursorTracker(stage);
const gaze = AvatarCore.makeGaze(cursor, { mulX: 0.9, mulY: 0.6 });
const headWander = AvatarCore.makeHeadWander();
const mouthPicker = AvatarCore.makeMouthPicker(W);
const warp = AvatarCore.makeWarp({
  threeUrl: "/static/vendor/three.module.js", glCanvas,
  getParts: () => parts, getManifest: () => manifest, W,
});
const annotator = AvatarCore.makeAnnotator({
  cv, ctx, setStatus, needDataUrl: true,
  onCreate: async (annot, name, done) => {   // 서버 POST → character_builder 로 캐릭터 생성
    const eyeR = Math.max(6, 0.03 * Math.max(annot.iw, annot.ih));
    const body = {
      name, image_b64: annot.dataUrl,
      eye_l: [...annot.eyeL, eyeR], eye_r: [...annot.eyeR, eyeR],
      mouth_box: annot.box, mouth_center: annot.mouthC,
    };
    setStatus("캐릭터 생성 중…");
    try {
      const res = await fetch("/api/characters/create", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
      const { id } = await res.json();
      done();
      await initCharacters(id);
      setStatus("✅ 캐릭터가 추가됐어요. 문장을 입력해보세요!");
    } catch (err) { setStatus(err.message, true); }
  },
});

// 드래그앤드랍·파일 입력 (어노테이터로 위임)
stage.addEventListener("dragover", e => e.preventDefault());
stage.addEventListener("drop", e => { e.preventDefault(); annotator.acceptFile(e.dataTransfer.files[0]); });
$("addChar").onclick = () => $("charFile").click();
$("charFile").onchange = e => { annotator.acceptFile(e.target.files[0]); e.target.value = ""; };

// 깜빡임 UI 배선
$("blinkBtn").onclick = () => blinker.trigger();
$("blinkInterval").oninput = e => $("blinkIntervalVal").textContent = e.target.value + "초";

// ---------- 렌더 루프 ----------
function render(now) {
  requestAnimationFrame(render);
  if (annotator.active()) {
    shakeEl.style.transform = "none";       // 어노테이션 중엔 흔들림 없음 (getBoundingClientRect 정합 유지)
    glCanvas.style.visibility = "hidden";   // 워프 캔버스 숨김
    annotator.draw();
    return;
  }
  if (!parts.base) return;

  // 평활 (비짐 떨림 방지 — 자음 반응성을 위해 빠르게, 매 프레임 무할당)
  AvatarCore.smoothStep(smooth, AvatarCore.weightsFromAnim(anim, audio));

  // 수동 오버라이드 (슬라이더·감정 프리셋은 base와 max 결합)
  const ov = { jawopen: +$("ovJaw").value, browinnerup: +$("ovBrow").value };
  const smileOv = +$("ovSmile").value;
  for (const k of ["mouthsmileleft", "mouthsmileright"]) smooth[k] = Math.max(smooth[k] || 0, smileOv);
  for (const k in ov) smooth[k] = Math.max(smooth[k] || 0, ov[k]);
  emo.applyMax(smooth, !!(anim && !audio.paused && !audio.ended));   // 발화 중이면 감정 유지, 유휴면 자동 감정 감쇠
  const blink = Math.max(blinker.value(now), +$("ovBlink").value,
                         Math.max(W("eyeblinkleft"), W("eyeblinkright")));

  // 머리 움직임: 발화 에너지(끄덕임) + 느린 표류 + 잔잔한 사인
  const sway = anim && !audio.paused ? 1 : 0.5;
  headWander(shakeEl, now, W("jawopen"), sway, emo.current());   // 감정 → 몸짓 연동

  const warpOn = warp.ready && warpToggle.checked;
  if (warpOn) { glCanvas.style.visibility = "visible"; warp.render(); }
  else { glCanvas.style.visibility = "hidden"; }

  ctx.clearRect(0, 0, 512, 512);
  const draw = (name, dx = 0, dyy = 0) => parts[name] && ctx.drawImage(parts[name], dx, dyy);

  if (!warpOn) draw("base");   // 워프 OFF/미지원: base를 2D로 그림 (폴백). ON이면 WebGL이 담당.
  const browUp = -manifest.browRange * Math.min(1, W("browinnerup") + (W("browouterupleft") + W("browouterupright")) / 2)
               + manifest.browRange * 0.8 * (W("browdownleft") + W("browdownright")) / 2;
  draw("brow_L", 0, browUp);
  draw("brow_R", 0, browUp);

  if (blink > 0.5) {
    draw("eye_L_closed"); draw("eye_R_closed");
  } else {
    draw("eye_L_open"); draw("eye_R_open");
    const [gsx, gsy] = gaze(+$("ovGaze").value, W);  // 슬라이더 > 엔진 채널 > 커서
    draw("pupil_L", gsx * manifest.pupilRange, gsy * manifest.pupilRange);
    draw("pupil_R", gsx * manifest.pupilRange, gsy * manifest.pupilRange);
  }
  const jawDy = warp.jawOverlayDy(W("jawopen"), warpOn, manifest);
  if (manifest.proceduralMouth) {
    AvatarCore.drawVectorMouth(ctx, W, manifest, jawDy);  // 근육 채널 직접 구동 (기본)
  } else {
    AvatarCore.drawSpriteMouth(ctx, parts, mouthPicker, now, jawDy);  // 스프라이트 크로스페이드
  }
}
requestAnimationFrame(render);

// ---------- 발화 (감정 프리셋 + 목소리 톤 적용 후 재생) ----------
const speak = (text, emotion) => AvatarCore.speakWithEmotion({
  text, emotion, autoEmo: $("autoEmo").checked, emo,
  voice: $("voice").value, engine: $("engine").value,
  audioEl: audio, onAnim: a => { anim = a; },
});

// ---------- 대화 모드 (마이크/입력 → LLM → 아바타 응답; 코어가 소유) ----------
const chatCtl = AvatarCore.makeChat({
  speak, logEl: $("chatlog"), botName: "아바타", placeholderOn: "아바타에게 말을 걸어보세요…",
  chatModeEl: $("chatMode"), clearBtnEl: $("clearChat"), textEl: $("text"),
  sendEl: $("send"), micBtnEl: $("micBtn"), formEl: $("form"), statusSet: setStatus,
  getPersona: () => manifest.persona,   // 선택된 캐릭터 성격을 대화에 반영
  audioEl: audio,   // 연속 대화: 응답 재생이 끝나야 재청취
});

$("form").onsubmit = async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("send").disabled = true;
  $("text").value = "";
  setStatus("생성 중…");
  try {
    if ($("chatMode").checked) await chatCtl.runChat(text);
    else await speak(text);
    setStatus("");
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $("send").disabled = false;
  }
};

warp.init();   // WebGL 워프 초기화 (실패 시 조용히 폴백). loadCharacter와 경쟁은 양방향 처리됨.
initCharacters();
fetch("/api/health").then(r => r.json()).then(h => {
  if (!h.a2f) document.querySelector('#engine option[value="a2f"]')?.remove();
  if (!h.joyvasa_ready) document.querySelector("h1 a")?.remove();
  if (!h.chat) {   // 대화 백엔드 없으면 대화 UI 숨김
    $("chatRow").style.display = "none";
    $("micBtn").style.display = "none";
  }
});
</script>
</body>
</html>
