<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말하는 그림 아바타</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #16161d; color: #e8e8ef;
  }
  main { width: min(560px, 94vw); padding: 24px 0 48px; }
  h1 { font-size: 1.2rem; font-weight: 600; margin: 16px 0; }
  .stage {
    position: relative; width: 100%; aspect-ratio: 1; background: #0d0d12;
    border-radius: 16px; overflow: hidden; border: 1px solid #2a2a35;
  }
  .stage video, .stage img { width: 100%; height: 100%; object-fit: contain; }
  .stage .placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #666; text-align: center; padding: 24px; white-space: pre-line;
  }
  form { display: flex; gap: 8px; margin-top: 16px; }
  input[type=text] {
    flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2a35;
    background: #0d0d12; color: inherit; font-size: 1rem;
  }
  button {
    padding: 12px 20px; border-radius: 10px; border: 0; background: #5b8cff;
    color: #fff; font-size: 1rem; cursor: pointer;
  }
  button:disabled { background: #333; cursor: default; }
  #saveVid {
    display: inline-block; margin-top: 12px; padding: 10px 18px; border-radius: 10px;
    background: #2a2a35; color: inherit; font-size: .9rem; text-decoration: none;
  }
  .controls { margin-top: 16px; display: grid; gap: 12px; font-size: .9rem; }
  .controls label { display: flex; align-items: center; gap: 10px; }
  .controls select, .controls input[type=range] { flex: 1; }
  #status { margin-top: 12px; color: #9a9ab0; font-size: .9rem; min-height: 1.2em; }
  #status.error { color: #ff7a7a; }
</style>
</head>
<body>
<main>
  <h1>🎨 말하는 사진·그림 <a href="/puppet" style="color:#9a9ab0;font-size:.85rem;text-decoration:none;float:right">실시간 퍼펫 모드 →</a></h1>

  <div class="stage" id="stage" title="사진을 끌어다 놓아도 됩니다">
    <img id="avatar" src="/api/avatar" alt="" onerror="this.style.display='none'">
    <video id="player" style="display:none" playsinline></video>
    <div id="placeholder" class="placeholder" style="display:none"></div>
  </div>
  <a id="saveVid" download hidden>영상 저장</a>

  <div class="controls" style="margin-top:12px">
    <button type="button" id="photoBtn" style="background:#2a2a35">📷 내 사진·그림 올리기</button>
    <input type="file" id="photoFile" accept="image/*" style="display:none">
  </div>

  <form id="form">
    <input id="text" type="text" placeholder="사진 속 얼굴이 말할 문장을 입력하세요…" autocomplete="off">
    <button id="send" type="submit">말하기</button>
  </form>

  <div class="controls">
    <label>목소리
      <select id="voice">
        <option value="ko-KR-SunHiNeural">선히 (여성)</option>
        <option value="ko-KR-InJoonNeural">인준 (남성)</option>
        <option value="ko-KR-HyunsuMultilingualNeural">현수 (남성)</option>
      </select>
    </label>
    <label>눈깜빡임 간격 <span id="blinkVal">4초</span>
      <input id="blink" type="range" min="0" max="10" step="0.5" value="4">
    </label>
    <label>깜빡임 강도 <span id="strengthVal">100%</span>
      <input id="strength" type="range" min="0" max="1" step="0.05" value="1">
    </label>
  </div>

  <div id="status"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const statusMsg = { queued: "대기 중…", tts: "음성 생성 중…", animating: "얼굴 애니메이션 생성 중… (수십 초 걸릴 수 있어요)" };

// 업로드한 사진(dataURL). 있으면 이 사진으로, 없으면 서버 폴더 기본 이미지로 생성.
let uploadedPhoto = null;
function acceptPhoto(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const reader = new FileReader();
  reader.onload = () => {
    uploadedPhoto = reader.result;
    $("avatar").src = uploadedPhoto;
    $("avatar").style.display = "";
    $("player").style.display = "none";
    $("placeholder").style.display = "none";
    setStatus("사진 준비됨 — 문장을 입력하고 ‘말하기’를 누르세요. (실사 사진이 가장 잘 됩니다)");
  };
  reader.readAsDataURL(file);
}
$("photoBtn").onclick = () => $("photoFile").click();
$("photoFile").onchange = e => { acceptPhoto(e.target.files[0]); e.target.value = ""; };
const stage = $("stage");
stage.addEventListener("dragover", e => e.preventDefault());
stage.addEventListener("drop", e => { e.preventDefault(); acceptPhoto(e.dataTransfer.files[0]); });

$("blink").oninput = e => $("blinkVal").textContent = e.target.value == 0 ? "끔" : e.target.value + "초";
$("strength").oninput = e => $("strengthVal").textContent = Math.round(e.target.value * 100) + "%";

async function checkHealth() {
  const h = await fetch("/api/health").then(r => r.json());
  const ph = $("placeholder");
  if (!h.image) {
    ph.style.display = "flex";
    ph.textContent = "📷 위 ‘내 사진·그림 올리기’로 사진을 올려보세요.\n실사 얼굴 사진이 가장 잘 됩니다.";
  } else if (!h.joyvasa_ready) {
    ph.style.display = "flex";
    ph.textContent = "모델 셋업 진행 중…";
    $("avatar").style.display = "";
  } else {
    ph.style.display = "none";
  }
}
checkHealth();

$("form").onsubmit = async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("send").disabled = true;
  $("saveVid").hidden = true;
  setStatus("전송 중…");
  try {
    const res = await fetch("/api/speak", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text,
        voice: $("voice").value,
        blink_interval: +$("blink").value,
        blink_strength: +$("strength").value,
        image_b64: uploadedPhoto,
      }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    await poll((await res.json()).job_id);
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $("send").disabled = false;
  }
};

async function poll(jobId) {
  while (true) {
    const job = await fetch(`/api/jobs/${jobId}`).then(r => r.json());
    if (job.status === "done") { play(job.video_url); setStatus(""); return; }
    if (job.status === "error") { setStatus(job.error, true); return; }
    setStatus(statusMsg[job.status] || job.status);
    await new Promise(r => setTimeout(r, 1500));
  }
}

function play(url) {
  const v = $("player");
  $("avatar").style.display = "none";
  v.style.display = "";
  v.src = url;
  v.play();
  v.onended = () => { v.style.display = "none"; $("avatar").style.display = ""; };
  // 서버는 생성물을 24시간 뒤 지운다(purge_old_media) — 남기려면 여기서 받아야 한다.
  const a = $("saveVid");
  a.href = url;
  a.download = `말하는그림_${$("text").value.trim().slice(0, 12)}.mp4`.replace(/[\\/:*?"<>|]/g, "_");
  a.hidden = false;
}

function setStatus(msg, isError) {
  const s = $("status");
  s.textContent = msg;
  s.className = isError ? "error" : "";
}
</script>
</body>
</html>
